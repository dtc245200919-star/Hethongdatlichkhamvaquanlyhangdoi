services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic_queue}
      POSTGRES_USER: ${POSTGRES_USER:-clinic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - clinic-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-clinic_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - clinic-network
    restart: unless-stopped

  appointments-api:
    build:
      context: .
      dockerfile: src/ClinicQueue.Appointments.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__ClinicDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-clinic_queue};Username=${POSTGRES_USER:-clinic_user};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER:-clinic_user}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RabbitMq__VirtualHost: /
      Cors__AllowedOrigin: ${CLIENT_ORIGIN:-http://localhost:3000}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - clinic-network
    restart: unless-stopped

  queue-worker:
    build:
      context: .
      dockerfile: src/ClinicQueue.Queue.Worker/Dockerfile
    environment:
      ConnectionStrings__ClinicDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-clinic_queue};Username=${POSTGRES_USER:-clinic_user};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER:-clinic_user}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RabbitMq__VirtualHost: /
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      appointments-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - clinic-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: src/ClinicQueue.Notification.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER:-clinic_user}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RabbitMq__VirtualHost: /
      Cors__AllowedOrigin: ${CLIENT_ORIGIN:-http://localhost:3000}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${NOTIFICATION_PORT:-8082}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - clinic-network
    restart: unless-stopped

networks:
  clinic-network:
    driver: bridge

volumes:
  postgres-data:
